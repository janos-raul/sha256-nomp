<style>
    /* Miner Stats (one miner) — console theme; markup and logic unchanged */
    .miner-stats-container { display: grid; gap: 12px; }
    .chart-wrapper, .balance-section, .workers-section {
        position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0;
    }
    .chart-wrapper::before, .chart-wrapper::after {
        content: ""; position: absolute; width: 8px; height: 8px; border-color: var(--accent); border-style: solid; pointer-events: none;
    }
    .chart-wrapper::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .chart-wrapper::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .miner-address { font: 600 13px var(--font-mono); color: var(--text-hi); overflow-wrap: anywhere; min-width: 0; }
    .miner-address i { color: var(--accent); margin-right: 8px; }
    .chart-stats { display: flex; border: 1px solid var(--line); flex-wrap: wrap; }
    .chart-stat { display: flex; align-items: baseline; gap: 6px; padding: 7px 12px; border-left: 1px solid var(--line); font: 500 11px var(--font-mono); color: var(--muted); }
    .chart-stat:first-child { border-left: 0; }
    .chart-stat i { display: none; }
    .chart-stat span { font: 600 10px var(--font-display); text-transform: uppercase; letter-spacing: 0.14em; }
    .chart-stat strong { color: var(--text-hi); font-weight: 600; }
    .chart-holder { position: relative; height: 260px; padding: 12px 14px; }
    .chart-holder canvas { width: 100% !important; height: 100% !important; }
    .balance-section { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 760px) { .balance-section { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .balance-item { padding: 14px; border-left: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
    .balance-item:first-child { border-left: 0; }
    @media (max-width: 760px) { .balance-item:nth-child(3) { border-left: 0; } .balance-item:nth-child(n+3) { border-top: 1px solid var(--line); } }
    .balance-icon { display: none; }
    .balance-label { font: 600 10.5px var(--font-display); text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); }
    .balance-value { font: 600 17px/1.2 var(--font-mono); color: var(--text-hi); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .section-divider { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .section-line { display: none; }
    .section-title { margin: 0; font: 600 11.5px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.16em; color: var(--text-hi); }
    .section-title i { color: var(--accent); margin-right: 8px; }
    .workers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 12px; }
    .worker-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
    .worker-card.pool { border-top: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
    .worker-card.solo { border-top: 1px solid color-mix(in srgb, var(--aux) 60%, transparent); }
    .worker-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .worker-name { font: 600 12px var(--font-mono); color: var(--text-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .worker-badge { flex: none; padding: 2px 6px; font: 600 9.5px/1.4 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid var(--line-hi); border-radius: var(--r); }
    .worker-badge.badge-pool { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    .worker-badge.badge-solo { color: var(--aux); border-color: color-mix(in srgb, var(--aux) 55%, transparent); background: var(--aux-soft); }
    .worker-stats { display: grid; }
    .worker-stat { display: flex; justify-content: space-between; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
    .worker-stat:last-child { border-bottom: 0; }
    .worker-stat-label { font: 600 9.5px/1.9 var(--font-display); text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
    .worker-stat-value { font: 500 12px var(--font-mono); color: var(--text-hi); text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
</style>

<div class="miner-stats-container">
    <!-- Hashrate Chart -->
    <div class="chart-wrapper">
        <div class="chart-header">
            <div class="miner-address">
                <i class="fas fa-wallet"></i> {{=String(it.stats.address).split(".")[0]}}
            </div>
            <div class="chart-stats">
                <div class="chart-stat">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Now:</span>
                    <strong id="statsHashrate">...</strong>
                </div>
                <div class="chart-stat">
                    <i class="fas fa-gauge"></i>
                    <span>Avg:</span>
                    <strong id="statsHashrateAvg">...</strong>
                </div>
                <div class="chart-stat">
                    <i class="fas fa-clock"></i>
                    <span>Luck:</span>
                    <strong id="statsLuckDays">...</strong>
                </div>
            </div>
        </div>
        <div class="chart-holder">
            <canvas id="workerHashrateChart"></canvas>
        </div>
    </div>

    <!-- Balance Section -->
    <div class="balance-section">
        <div class="balance-item">
            <div class="balance-icon">
                <i class="fas fa-hourglass-half"></i>
            </div>
            <div class="balance-label">Immature</div>
            <div class="balance-value" id="statsTotalImmature">...</div>
        </div>
        <div class="balance-item">
            <div class="balance-icon">
                <i class="fas fa-wallet"></i>
            </div>
            <div class="balance-label">Balance</div>
            <div class="balance-value" id="statsTotalBal">...</div>
        </div>
        <div class="balance-item">
            <div class="balance-icon">
                <i class="fas fa-money-bill-wave"></i>
            </div>
            <div class="balance-label">Total Paid</div>
            <div class="balance-value" id="statsTotalPaid">...</div>
        </div>
        <div class="balance-item">
            <div class="balance-icon">
                <i class="fas fa-chart-bar"></i>
            </div>
            <div class="balance-label">Total Shares</div>
            <div class="balance-value" id="statsTotalShares">...</div>
        </div>
    </div>

    <!-- Pool Workers Section -->
    <div id="poolWorkersSection" class="workers-section" style="display:none;">
        <div class="section-divider">
            <h3 class="section-title">
                <i class="fas fa-server"></i> Pool Workers
            </h3>
            <div class="section-line"></div>
        </div>
        <div id="boxesPoolWorkers" class="workers-grid"></div>
    </div>

    <!-- Solo Workers Section -->
    <div id="soloWorkersSection" class="workers-section" style="display:none;">
        <div class="section-divider">
            <h3 class="section-title">
                <i class="fas fa-user"></i> Solo Workers
            </h3>
            <div class="section-line"></div>
        </div>
        <div id="boxesSoloWorkers" class="workers-grid"></div>
    </div>
</div>

<script>
    var _miner = "{{=String(it.stats.address || '').split('.')[0]}}";
    var _workerCount = 0;

    // Make functions available globally
    window.getWorkerNameFromAddress = function (w) {
        var worker = w;
        // Check if there's a dot in the address (indicating a worker name)
        if (w.indexOf(".") > -1) {
            var parts = w.split(".");
            // Get everything after the first dot as the worker name
            worker = parts.slice(1).join(".");
            // If worker name is empty or just whitespace, use "noname"
            if (!worker || worker.trim().length === 0) {
                worker = "no-name";
            }
        } else {
            // No dot found, so no worker name provided
            worker = "no-name";
        }
        return worker;
    };

    // Modern worker display function
    function addWorkerToDisplay(name, htmlSafeName, workerObj, isSolo) {
        var htmlToAdd = '';
        var cardClass = isSolo ? 'solo' : 'pool';
        var badgeClass = isSolo ? 'badge-solo' : 'badge-pool';
        var badgeText = isSolo ? 'SOLO' : 'POOL';

        // Ensure we display "noname" if no worker name is provided
        var displayName = name;
        if (!displayName || displayName.trim().length === 0) {
            displayName = "no-name";
        }

        htmlToAdd = '<div class="worker-card ' + cardClass + '" id="worker_' + htmlSafeName + '">';
        htmlToAdd += '<div class="worker-header">';
        htmlToAdd += '<div class="worker-name">' + displayName.replace(/[^\w\s\-]/gi, '') + '</div>';
        htmlToAdd += '<span class="worker-badge ' + badgeClass + '">' + badgeText + '</span>';
        htmlToAdd += '</div>';
        htmlToAdd += '<div class="worker-stats">';

        // Hashrate Now
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-tachometer-alt"></i> Hashrate</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsHashrate' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Hashrate Avg
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-gauge"></i> Average</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsHashrateAvg' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Difficulty
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-unlock-alt"></i> Difficulty</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsDiff' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Shares
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-cog"></i> Shares</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsShares' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Best Share
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-trophy"></i> Best Share</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsBestShare' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Last Share
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-bolt"></i> Last Share</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsLastShare' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Luck
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-clock"></i> Luck</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsLuckDays' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Immature
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-hourglass-half"></i> Immature</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsImmature' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Balance
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-wallet"></i> Balance</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsBalance' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        // Paid
        htmlToAdd += '<div class="worker-stat">';
        htmlToAdd += '<span class="worker-stat-label"><i class="fas fa-money-bill"></i> Paid</span>';
        htmlToAdd += '<span class="worker-stat-value" id="statsPaid' + htmlSafeName + '">...</span>';
        htmlToAdd += '</div>';

        htmlToAdd += '</div></div>';

        var targetContainer = isSolo ? "#boxesSoloWorkers" : "#boxesPoolWorkers";
        var targetSection = isSolo ? "#soloWorkersSection" : "#poolWorkersSection";

        $(targetSection).show();
        $(targetContainer).append(htmlToAdd);
    }

    function rebuildWorkerDisplay() {
        $("#boxesPoolWorkers").html("");
        $("#boxesSoloWorkers").html("");
        $("#poolWorkersSection").hide();
        $("#soloWorkersSection").hide();

        if (window.statData && window.statData.workers) {
            for (var w in window.statData.workers) {
                var worker = window.statData.workers[w];
                var isSolo = worker.isSolo === true;
                var htmlSafeWorkerName = (isSolo ? 'solo_' : '') + w.split('.').join('_').replace(/[^\w\s\-]/gi, '');
                var saneWorkerName = getWorkerNameFromAddress(w);
                addWorkerToDisplay(saneWorkerName, htmlSafeWorkerName, worker, isSolo);
            }
        }
    }

    // Make functions globally available
    window.rebuildWorkerDisplay = rebuildWorkerDisplay;
    window.addWorkerToDisplay = addWorkerToDisplay;

    // Initialize - prevent double loading
    $(document).ready(function () {
        console.log('Initializing miner stats for:', _miner);

        // Check if script is already loaded to prevent double loading
        if (!window.minerStatsScriptLoaded) {
            window.minerStatsScriptLoaded = true;

            // Load the modernized miner_stats.js directly
            // EventSource is already handled by main.js globally
            var script = document.createElement('script');
            script.src = '/static/modern-miner-stats.js?v=' + Date.now();
            script.onload = function () {
                console.log('Miner stats script loaded successfully');
            };
            document.querySelector('main').appendChild(script);
        }
    });
</script>
